# Render Blueprint: the Hivewright runtime (FastAPI) on Render's free plan.
# One-click: https://render.com/deploy?repo=https://github.com/MuhammadTalhakhan2003/hivewright
services:
  - type: web
    name: hivewright-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn hivewright.api:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_API_KEY
        sync: false # Render asks for it during setup; never committed
      - key: HIVEWRIGHT_PROVIDER
        value: groq
      - key: HIVEWRIGHT_HOUSE_RUNS_PER_IP
        value: "5"
      - key: HIVEWRIGHT_MAX_CONCURRENT_RUNS
        value: "4"
